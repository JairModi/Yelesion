<!--
  Vite entry HTML for the React app.
  Vite injects the dev-server/HMR client automatically and, at build time,
  rewrites the module script tag below to point at the hashed bundle in
  dist/assets/. Everything visible on the page is rendered by React into
  the empty <div id="root">.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yelesion builds software that connects people with innovative solutions and helps businesses move forward." />
    <title>Yelesion — Software Solutions</title>
  </head>
  <body>
    <!-- React mounts the whole app (see src/main.jsx) inside this div. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
